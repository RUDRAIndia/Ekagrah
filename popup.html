<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Ekagrah</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">EKAGRAH</h1>
            <p class="subtitle">AI Code Detector</p>
        </div>

        <div class="status-card">
            <div class="toggle-container">
                <span class="toggle-label" id="toggle-status-text">Ekagrah is ON</span>
                <label class="switch">
                    <input type="checkbox" id="power-toggle" checked>
                    <span class="slider round"></span>
                </label>
            </div>
            
            <div class="divider"></div>
            
            <div class="session-info">
                <span class="session-label">Session Status:</span>
                <div class="session-badge" id="session-badge">
                    <span class="badge-icon">✅</span>
                    <span class="badge-text">Session Clean</span>
                </div>
            </div>
        </div>

        <div class="footer">
            <p>Ensure genuine coding practice.</p>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
